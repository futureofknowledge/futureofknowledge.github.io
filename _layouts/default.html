<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p class="site-meta">
          {{ site.event_dates }}<br>
          {{ site.event_place }}
        </p>

        <nav class="site-nav">
          <ul>
            {% for item in site.nav %}
            <li>
              <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
            </li>
            {% endfor %}
          </ul>
        </nav>

        <p class="site-host">
          University of Amsterdam<br>
          <a href="https://fairandresilientsocieties.uva.nl/en">Fair and Resilient Societies</a>
        </p>
      </header>

      <section>
        {{ content }}
      </section>

      <footer>
        <p><small>Materials from this convening are published openly.</small></p>
      </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
