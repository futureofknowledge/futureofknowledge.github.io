title: Future of Knowledge Symposium
tagline: Amsterdam 2026
description: A two-day symposium on the future of knowledge, hosted by the University of Amsterdam on 16–17 November 2026.
url: https://futureofknowledge.github.io
lang: en-GB

theme: jekyll-theme-minimal

event_dates: 16–17 November 2026
event_place: Nieuwe Achtergracht 166, 1018 WS, Amsterdam

plugins:
  - jekyll-seo-tag

sass:
  style: compressed

# github-pages bundles jekyll-titles-from-headings, which would otherwise
# make the first heading the page title. Keep the tab and search result as
# "Future of Knowledge Symposium | Amsterdam 2026" regardless of how the page opens.
titles_from_headings:
  enabled: false

# Note: setting `exclude` replaces Jekyll's defaults rather than adding to
# them, so the Gemfile entries have to stay listed here.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
